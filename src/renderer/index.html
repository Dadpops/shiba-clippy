<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiba Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Nunito', sans-serif;
      user-select: none;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px;
    }

    /* ─── Speech Bubble ─── */
    #bubble {
      background: #fffdf7;
      border: 2.5px solid #e8a020;
      border-radius: 18px 18px 4px 18px;
      padding: 14px 16px;
      max-width: 310px;
      min-width: 200px;
      margin-bottom: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.08);
      position: relative;
      display: none;
      animation: bubblePop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #bubble.visible { display: block; }

    #bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      right: 28px;
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 4px solid transparent;
      border-top: 12px solid #fffdf7;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,0.08));
    }

    #bubble-text {
      font-size: 13.5px;
      line-height: 1.55;
      color: #3a2e1e;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .tag-reminder { background: #fff3cd; color: #856404; }
    .tag-email    { background: #d1e7ff; color: #084298; }
    .tag-chat     { background: #d1fae5; color: #065f46; }

    /* ─── Chat Panel ─── */
    #chat-panel {
      background: rgba(255, 253, 247, 0.97);
      border: 2.5px solid #e8a020;
      border-radius: 16px;
      width: 340px;
      max-height: 340px;
      margin-bottom: 6px;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      overflow: hidden;
      animation: slideUp 0.2s ease-out;
    }
    #chat-panel.visible { display: flex; }

    #chat-header {
      background: linear-gradient(135deg, #f97316, #e8a020);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #chat-header span {
      font-size: 13px;
      font-weight: 800;
      color: white;
      letter-spacing: 0.3px;
    }
    #chat-header button {
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      width: 22px; height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    #chat-header button:hover { background: rgba(255,255,255,0.4); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #e8a020; border-radius: 2px; }

    .msg {
      max-width: 85%;
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.2s ease-out;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #f97316, #e8a020);
      color: white;
      border-radius: 12px 12px 2px 12px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #f3f0e8;
      color: #3a2e1e;
      border-radius: 2px 12px 12px 12px;
    }
    .msg.system {
      align-self: center;
      background: #fef3c7;
      color: #92400e;
      font-size: 11px;
      border-radius: 8px;
      padding: 4px 10px;
    }

    #typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 8px 12px;
      background: #f3f0e8;
      border-radius: 2px 12px 12px 12px;
    }
    #typing-indicator.visible { display: flex; gap: 4px; align-items: center; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e8a020;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    #input-row {
      padding: 10px 12px;
      border-top: 1.5px solid #f0e8d5;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid #e8c878;
      border-radius: 10px;
      padding: 7px 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      resize: none;
      outline: none;
      background: #fffdf7;
      color: #3a2e1e;
      max-height: 80px;
      min-height: 34px;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #f97316; }
    #user-input::placeholder { color: #b8a890; }

    #send-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #f97316, #e8a020);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      flex-shrink: 0;
    }
    #send-btn:hover { transform: scale(1.08); }
    #send-btn:active { transform: scale(0.95); opacity: 0.85; }

    /* ─── Shiba Character ─── */
    #shiba-container {
      width: 120px;
      height: 120px;
      position: relative;
      cursor: pointer;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.2));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #shiba-container:hover { transform: scale(1.06) translateY(-2px); }
    #shiba-container:active { transform: scale(0.97); }

    #shiba-container.bounce {
      animation: shibaBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #shiba-container.excited {
      animation: shibaExcited 0.8s ease-in-out;
    }

    /* ─── Quick Actions ─── */
    #quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    #quick-actions.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }
    .quick-btn {
      background: rgba(255,253,247,0.95);
      border: 2px solid #e8a020;
      border-radius: 20px;
      padding: 5px 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #c2540a;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .quick-btn:hover {
      background: #f97316;
      color: white;
      border-color: #f97316;
      transform: translateY(-1px);
    }

    /* ─── Animations ─── */
    @keyframes bubblePop {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }
    @keyframes shibaBounce {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-16px) rotate(-5deg); }
      60%  { transform: translateY(-6px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes shibaExcited {
      0%   { transform: rotate(0deg) scale(1); }
      15%  { transform: rotate(-8deg) scale(1.1); }
      30%  { transform: rotate(8deg) scale(1.1); }
      45%  { transform: rotate(-5deg) scale(1.05); }
      60%  { transform: rotate(5deg) scale(1.05); }
      75%  { transform: rotate(-2deg) scale(1.02); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-5px); }
    }
    #shiba-svg { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body>

  <!-- Speech Bubble -->
  <div id="bubble">
    <div id="bubble-tag" class="bubble-tag tag-chat">Shiba</div>
    <div id="bubble-text">Woof! Click me to chat! 🐾</div>
  </div>

  <!-- Chat Panel -->
  <div id="chat-panel">
    <div id="chat-header">
      <span>🐕 Shiba Assistant</span>
      <button id="close-chat" title="Close">✕</button>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask Shiba anything..."></textarea>
      <button id="send-btn" title="Send">➤</button>
    </div>
  </div>

  <!-- Quick Actions -->
  <div id="quick-actions">
    <button class="quick-btn" data-prompt="Draft me a professional email for ">✉️ Email</button>
    <button class="quick-btn" data-prompt="Set a reminder for me: ">⏰ Reminder</button>
    <button class="quick-btn" data-prompt="Give me a quick productivity tip">💡 Tip</button>
  </div>

  <!-- Shiba Character SVG -->
  <div id="shiba-container" title="Click to chat with Shiba!">
    <svg id="shiba-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="120" height="120">
      <!-- Body -->
      <ellipse cx="60" cy="82" rx="32" ry="26" fill="#e8963a"/>
      <!-- Belly -->
      <ellipse cx="60" cy="88" rx="18" ry="16" fill="#f5d08a"/>

      <!-- Tail -->
      <path d="M88 72 Q108 52 98 40 Q92 34 86 44 Q82 55 88 72Z" fill="#e8963a"/>
      <path d="M88 72 Q104 55 96 44 Q93 38 88 46 Q85 56 88 72Z" fill="#f5a84a" opacity="0.5"/>

      <!-- Hind legs -->
      <ellipse cx="40" cy="100" rx="10" ry="7" fill="#d47830"/>
      <ellipse cx="80" cy="100" rx="10" ry="7" fill="#d47830"/>
      <!-- Paws -->
      <ellipse cx="40" cy="106" rx="9" ry="5" fill="#f5d08a"/>
      <ellipse cx="80" cy="106" rx="9" ry="5" fill="#f5d08a"/>

      <!-- Head -->
      <ellipse cx="60" cy="52" rx="28" ry="26" fill="#e8963a"/>

      <!-- Ears -->
      <polygon points="36,34 28,12 46,26" fill="#e8963a"/>
      <polygon points="84,34 92,12 74,26" fill="#e8963a"/>
      <!-- Inner ears -->
      <polygon points="37,32 31,17 45,27" fill="#e84040" opacity="0.7"/>
      <polygon points="83,32 89,17 75,27" fill="#e84040" opacity="0.7"/>

      <!-- Face - cheeks -->
      <ellipse cx="42" cy="58" rx="9" ry="6" fill="#f5a080" opacity="0.5"/>
      <ellipse cx="78" cy="58" rx="9" ry="6" fill="#f5a080" opacity="0.5"/>

      <!-- Eyes -->
      <ellipse id="eye-left"  cx="50" cy="50" rx="7" ry="7.5" fill="#2a1a08"/>
      <ellipse id="eye-right" cx="70" cy="50" rx="7" ry="7.5" fill="#2a1a08"/>
      <!-- Eye shine -->
      <circle cx="52.5" cy="47.5" r="2.5" fill="white"/>
      <circle cx="72.5" cy="47.5" r="2.5" fill="white"/>
      <!-- Small shine -->
      <circle cx="54.5" cy="51.5" r="1" fill="white"/>
      <circle cx="74.5" cy="51.5" r="1" fill="white"/>

      <!-- Nose -->
      <ellipse cx="60" cy="60" rx="6" ry="4.5" fill="#2a1a08"/>
      <ellipse cx="59" cy="59" rx="2" ry="1.5" fill="white" opacity="0.4"/>

      <!-- Mouth -->
      <path d="M54 65 Q60 70 66 65" stroke="#2a1a08" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M60 65 L60 69" stroke="#2a1a08" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Forehead marking -->
      <path d="M55 38 Q60 34 65 38 Q62 42 58 42 Z" fill="#c87020" opacity="0.4"/>

      <!-- Front paws -->
      <ellipse cx="46" cy="97" rx="8" ry="5" fill="#d47830"/>
      <ellipse cx="74" cy="97" rx="8" ry="5" fill="#d47830"/>
      <ellipse cx="46" cy="100" rx="7" ry="4" fill="#f5d08a"/>
      <ellipse cx="74" cy="100" rx="7" ry="4" fill="#f5d08a"/>
    </svg>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
